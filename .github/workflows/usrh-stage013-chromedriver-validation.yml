name: USRH Stage013 Branded Chrome Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-diagnostic:
    runs-on: windows-2025
    steps:
      - name: Record diagnostic boundary
        shell: pwsh
        run: |
          [ordered]@{
            decision='BRANDED_CHROME_COMMAND_LINE_UNPACKED_EXTENSION_LOAD_BLOCKED'
            qualified_alternative='CHROME_FOR_TESTING'
            qualified_run_id=30962846954
            release_zip_sha256='1d0ac32dc0da7a8f18ab100b06620fad076232387126c4885773f0772c11b286'
          } | ConvertTo-Json | Set-Content BRANDED_CHROME_DIAGNOSTIC.json
      - uses: actions/upload-artifact@v4
        with:
          name: usrh-stage013-branded-chrome-diagnostic
          path: BRANDED_CHROME_DIAGNOSTIC.json
          retention-days: 30
