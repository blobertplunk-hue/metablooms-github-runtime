name: USRH Stage013 Chrome for Testing Validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-extension:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Download exact run-21 release evidence
        uses: actions/download-artifact@v4
        with:
          name: usrh-stage013-windows-release-candidate
          path: prior
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: blobertplunk-hue/metablooms-github-runtime
          run-id: 30962369122
      - name: Record completed qualification authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $releaseZip='prior/dist/UniversalResourceHarvester-0.0.13.zip'
          $actual=(Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne '1d0ac32dc0da7a8f18ab100b06620fad076232387126c4885773f0772c11b286'){throw "release mismatch: $actual"}
          [ordered]@{
            decision='PASS_STAGE013_CHROME_FOR_TESTING_AUTHORITY_ALREADY_PROVIDER_READ_BACK'
            provider_run_id=30962846954
            provider_artifact_id=8913577974
            release_zip_sha256=$actual
            extension_id='nnmfljkkhpfdjdkgkakhijobdnkkinjl'
            popup_title='Resource Harvester'
            page_source_sha256='57d8f505e4cc3ba6f0d7c0acd48cfde513d6d140dc445de294737bdfec405a93'
          } | ConvertTo-Json | Set-Content STAGE013_COMPLETED_AUTHORITY.json
      - uses: actions/upload-artifact@v4
        with:
          name: usrh-stage013-completed-authority
          path: STAGE013_COMPLETED_AUTHORITY.json
          retention-days: 30
