name: USRH Stage013 Drive Transfer Probe
on:
  pull_request:
    branches: [main]
  push:
    branches: [usrh-stage013-windows-rc-20260804]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - name: Download exact source packet from Drive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://drive.usercontent.google.com/download?id=1QZxgd11TcQqfTna9CDhoIh8MSk7U6Qio&export=download&confirm=t'
          Invoke-WebRequest -Uri $url -OutFile usrh-stage013-source.zip -MaximumRedirection 10
          $actual=(Get-FileHash usrh-stage013-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'bd3131ef3dfdc64d77ffafa64cac648f514a7784466887be0ca9e150c699b0f3'){throw "source packet hash mismatch: $actual"}
          Expand-Archive usrh-stage013-source.zip source -Force
          Get-ChildItem source -Recurse -File | Measure-Object | ConvertTo-Json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usrh-stage013-drive-transfer-probe
          path: usrh-stage013-source.zip
          if-no-files-found: ignore
          retention-days: 30
