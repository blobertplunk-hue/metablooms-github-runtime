name: USRH Stage013 Windows Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-authority:
    runs-on: windows-2025
    steps:
      - name: Record completed provider authority
        shell: pwsh
        run: |
          [ordered]@{
            decision='PASS_STAGE013_WINDOWS_AUTHORITY_ALREADY_PROVIDER_READ_BACK'
            provider_run_id=30962369122
            provider_artifact_id=8913428519
            release_zip_sha256='1d0ac32dc0da7a8f18ab100b06620fad076232387126c4885773f0772c11b286'
            pester='5_OF_5_PASS'
            native_process='5_OF_5_PASS'
            native_handshake='PASS'
            synthetic_crawl='PASS'
            uninstall='PASS'
            offline_reinstall='PASS'
          } | ConvertTo-Json | Set-Content STAGE013_WINDOWS_COMPLETED_AUTHORITY.json
      - uses: actions/upload-artifact@v4
        with:
          name: usrh-stage013-windows-completed-authority
          path: STAGE013_WINDOWS_COMPLETED_AUTHORITY.json
          retention-days: 30
