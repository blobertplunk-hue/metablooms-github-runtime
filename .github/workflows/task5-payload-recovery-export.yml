name: Task 5 Payload Recovery Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-task5-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upload preserved Task 5 payload
        uses: actions/upload-artifact@v4
        with:
          name: task5-payload-recovery
          path: task5_validation/TASK5_WINDOWS_VALIDATION_PAYLOAD.zip.b64
          if-no-files-found: error
          retention-days: 1
