name: SARP Connector Validate

on:
  pull_request:
    paths:
      - "docs/SARP_*"
      - "scripts/sarp_connector.py"
      - ".github/ISSUE_TEMPLATE/sarp-review.yml"
      - ".github/PULL_REQUEST_TEMPLATE/sarp_packet.md"
      - ".github/workflows/sarp-connector-validate.yml"
      - "sarp/**"
  workflow_dispatch:
    inputs:
      verdict_file:
        description: "Optional SARP verdict markdown/json file to validate"
        required: false
        type: string

jobs:
  validate-sarp-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile SARP connector helper
        run: python3 -m py_compile scripts/sarp_connector.py
      - name: Validate optional verdict file
        if: inputs.verdict_file != ''
        run: python3 scripts/sarp_connector.py validate-verdict --file "${{ inputs.verdict_file }}" --receipt runtime_work/SARP_VERDICT_VALIDATION_RECEIPT.json
