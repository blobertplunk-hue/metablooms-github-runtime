name: Student Data Hub PdfPig Windows Probe

on:
  push:
    branches:
      - student-data-hub-pdf-ci-20260808
    paths:
      - ".github/workflows/student-data-hub-pdf-ci.yml"
      - "ci/student-data-hub-pdf/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/student-data-hub-pdf-ci.yml"
      - "ci/student-data-hub-pdf/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  pdfpig-windows-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore exact PdfPig 0.1.15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $restore = Join-Path $env:RUNNER_TEMP 'pdfpig-restore'
          New-Item -ItemType Directory -Force -Path $restore | Out-Null
          Push-Location $restore
          dotnet new classlib --framework net8.0 --force
          dotnet add package PdfPig --version 0.1.15
          dotnet restore --packages "$env:RUNNER_TEMP\nuget"
          Pop-Location
          $dll = Get-ChildItem -Path "$env:RUNNER_TEMP\nuget\pdfpig\0.1.15" -Recurse -File -Filter 'UglyToad.PdfPig.dll' |
            Where-Object { $_.FullName -match '[\\/]net8\.0[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw 'PdfPig net8.0 assembly not found after exact restore.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'ci\student-data-hub-pdf\artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $requiredAssemblies=@('UglyToad.PdfPig.Core.dll','UglyToad.PdfPig.Tokens.dll','UglyToad.PdfPig.Tokenization.dll','UglyToad.PdfPig.Fonts.dll','UglyToad.PdfPig.dll')
          foreach($assemblyName in $requiredAssemblies){
            $source=Join-Path $dll.Directory.FullName $assemblyName
            if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw "Required PdfPig assembly missing after restore: $assemblyName"}
            Copy-Item -LiteralPath $source -Destination (Join-Path $out $assemblyName)
          }
          dotnet --info | Set-Content -LiteralPath (Join-Path $out 'DOTNET_INFO.txt') -Encoding UTF8
          $assemblyHashes=foreach($assemblyName in $requiredAssemblies){
            $target=Join-Path $out $assemblyName
            [ordered]@{name=$assemblyName;sha256=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant();bytes=(Get-Item -LiteralPath $target).Length}
          }
          $assemblyHashes | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $out 'PDFPIG_ASSEMBLIES.json') -Encoding UTF8

      - name: Download exact PowerShell 7.6.3 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.3-win-x64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'pwsh763'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.3/PowerShell-7.6.3-win-x64.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $version = & (Join-Path $dir 'pwsh.exe') -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($version.Trim() -ne '7.6.3') { throw "Unexpected PowerShell version: $version" }
          "version=$version" | Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact\POWERSHELL_VERSION.txt" -Encoding UTF8

      - name: Run positive probe on Windows PowerShell 7.6.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh763\pwsh.exe'
          $dll = "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact\UglyToad.PdfPig.dll"
          $out = "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact\positive"
          & $pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\PdfPigProbe.ps1" -PdfPigDll $dll -OutputDir $out
          if ($LASTEXITCODE -ne 0) { throw "Positive probe failed exit=$LASTEXITCODE" }

      - name: Run negative-control adequacy probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh763\pwsh.exe'
          $dll = "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact\UglyToad.PdfPig.dll"
          $out = "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact\negative"
          & $pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\PdfPigProbe.ps1" -PdfPigDll $dll -OutputDir $out -NegativeControl
          if ($LASTEXITCODE -ne 86) { throw "Negative-control probe failed to detect mutation as expected; exit=$LASTEXITCODE" }
          Write-Host 'NEGATIVE CONTROL ADEQUACY PASS expected_exit=86'

      - name: Write provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\ci\student-data-hub-pdf\artifact"
          $dll = Join-Path $root 'UglyToad.PdfPig.dll'
          $obj = [ordered]@{
            schema = 'mb.lakeland.pdfpig.windows_ci_provenance.v1'
            created_at_utc = [DateTime]::UtcNow.ToString('o')
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            package_id = 'PdfPig'
            package_version = '0.1.15'
            dll_sha256 = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            assemblies = @(Get-ChildItem -LiteralPath $root -File -Filter 'UglyToad.PdfPig*.dll' | Sort-Object Name | ForEach-Object {[ordered]@{name=$_.Name;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant();bytes=$_.Length}})
            powershell_version = '7.6.3'
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit_sha = $env:GITHUB_SHA
            branch = $env:GITHUB_REF_NAME
          }
          $obj | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'PROVENANCE.json') -Encoding UTF8

      - name: Upload exact probe artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakeland-pdfpig-windows-probe
          path: ci/student-data-hub-pdf/artifact
          if-no-files-found: warn
          retention-days: 7

      - name: Publish machine-readable probe locator to draft PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $body = @"
          STUDENT_DATA_HUB_PDFPIG_PROBE
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          artifact_id=$env:ARTIFACT_ID
          head_sha=${{ github.sha }}
          ref=${{ github.ref }}
          job_status=${{ job.status }}
          "@
          $body | Set-Content -LiteralPath "$env:RUNNER_TEMP\probe-comment.txt" -Encoding UTF8
          gh pr comment 3 --repo "${{ github.repository }}" --body-file "$env:RUNNER_TEMP\probe-comment.txt"
